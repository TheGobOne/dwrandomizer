<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dragon Warrior Randomizer - TheGobOne Remix</title>
<style>
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 var(--font,system-ui,sans-serif)}
button,input,select{font:inherit;color:inherit}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--focus,#ffd23f);outline-offset:2px}
.backlink{display:inline-block;padding:.5rem .75rem;color:var(--link,var(--fg));font-size:.85rem;text-decoration:underline}
a{color:var(--link,inherit)}
/* shared control skeleton, themed per page through variables */
.opt{position:relative;padding:.55rem .6rem;display:grid;grid-template-columns:auto 1fr;column-gap:.7rem;row-gap:.1rem;align-items:start}
.opt .tog{grid-row:1/3;min-width:3.1rem;min-height:2.75rem;cursor:pointer;background:var(--tog-bg,transparent);border:var(--tog-bd,2px solid currentColor);border-radius:var(--tog-r,0);padding:0 .35rem;display:inline-flex;align-items:center;justify-content:center;font-weight:700}
.opt .tog[data-state="1"]{background:var(--tog-on,var(--accent));color:var(--tog-on-fg,var(--bg))}
.opt .tog[data-state="2"]{background:var(--tog-rnd,var(--accent2,var(--accent)));color:var(--tog-on-fg,var(--bg));border-style:dashed}
.opt .name{font-weight:700;align-self:center;cursor:pointer}
.opt .desc{grid-column:2;margin:0;font-size:.85rem;color:var(--muted)}
.opt.k-select,.opt.k-pack{grid-template-columns:1fr}
.opt.k-select .desc,.opt.k-pack .desc{grid-column:1}
.opt select,.opt input[type=number],.opt input[type=file]{max-width:100%;background:var(--field,transparent);border:var(--field-bd,2px solid currentColor);border-radius:var(--tog-r,0);padding:.45rem .5rem;min-height:2.6rem}
.opt.k-toggle>.bankbox,.opt.k-toggle>.packbox{grid-column:1/-1}
.bankbox,.packbox{margin:.5rem 0 .2rem;padding:.7rem;border:var(--sub-bd,2px dashed currentColor);display:grid;gap:.4rem}
.sublab{font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.caprow{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.caprow input[type=range]{flex:1 1 8rem;min-height:2.5rem;accent-color:var(--accent)}
.caprow input[type=number]{width:5rem}
.banknote,.packstat{margin:0;font-size:.85rem}
.tiers,.scenes{display:flex;flex-wrap:wrap;gap:.3rem}
.tier,.scene{border:1px solid currentColor;padding:.1rem .4rem;font-size:.78rem}
.scene.used{background:var(--accent);color:var(--bg)}
.songs{margin:0;padding-left:1.1rem;font-size:.85rem}
.mini,.btn{cursor:pointer;min-height:2.75rem;padding:.4rem .9rem;background:var(--btn-bg,var(--accent));color:var(--btn-fg,var(--bg));border:var(--btn-bd,2px solid currentColor);border-radius:var(--tog-r,0);font-weight:700}
.mini{min-height:2.4rem;padding:.2rem .7rem;font-size:.85rem;--btn-bg:transparent;--btn-fg:currentColor}
input[type=text]{background:var(--field,transparent);border:var(--field-bd,2px solid currentColor);border-radius:var(--tog-r,0);padding:.5rem;min-height:2.75rem;max-width:100%}
.result{margin:.5rem 0;word-break:break-all}
.sumlist{margin:0;padding-left:1.1rem;font-size:.9rem}
.romfile{max-width:100%}
.tab{cursor:pointer}
.count{display:inline-block;min-width:1.4em;text-align:center;font-size:.75em;padding:0 .3em;margin-left:.35em;border:1px solid currentColor}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

:root{--blue:#00008a;--line:#5a6bd0;--soft:#b9c4ff;--bg:#000;--fg:#fff;--accent:#fff;--muted:var(--soft);--font:"Courier New",ui-monospace,monospace;--tog-bd:0;--tog-on:#fff;--tog-on-fg:var(--blue);--tog-rnd:#9ad;--field:var(--blue);--field-bd:2px solid #fff;--btn-bg:var(--blue);--btn-fg:#fff;--btn-bd:3px double #fff;--sub-bd:2px solid #9ad;--focus:#ffff55}
body{font-weight:700;letter-spacing:.02em}
.screen{max-width:1000px;margin:0 auto;padding:.5rem 1rem 2rem;display:grid;gap:1.4rem}
.win{background:var(--blue);border:4px double #fff;border-radius:6px;padding:1rem 1rem .8rem;box-shadow:0 0 0 3px #000,0 0 0 5px #fff4;position:relative}
.win h2{margin:0;font-size:1rem;text-transform:uppercase;letter-spacing:.12em;background:#000;padding:0 .5rem;position:absolute;top:-.8rem;left:1rem}
.title{text-align:center}
.title h1{font-size:clamp(1.2rem,5vw,2.2rem);letter-spacing:.2em;margin:.2rem 0}
.title p{margin:.2rem 0;color:var(--muted);font-weight:400}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin:.4rem 0}
.row label{min-width:4.5rem}
.row input[type=text]{flex:1 1 14rem;color:#fff;font-size:.85rem}
.main{display:grid;grid-template-columns:15rem 1fr;gap:1.4rem;align-items:start}
.cmd{display:flex;flex-direction:column;gap:.1rem}
.cmd .tab{background:none;border:0;color:#fff;text-align:left;padding:.45rem .5rem .45rem 1.6rem;min-height:2.75rem;position:relative;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.cmd .tab::before{content:"";position:absolute;left:.4rem;top:50%;margin-top:-.4rem;border-left:.7rem solid transparent;border-top:.4rem solid transparent;border-bottom:.4rem solid transparent}
.cmd .tab.active::before{border-left-color:#fff}
.cmd .tab:hover::before{border-left-color:#9ad}
.cmd .tab.active{background:#000}
.cmd .count{float:right;border:0;color:#9ad}
.panel .blurb{margin:0 0 .6rem;color:var(--muted);font-weight:400}
.opts{display:grid;gap:.1rem}
.opt{border-bottom:1px dotted var(--line)}
.opt .tog{font-family:inherit}
.opt .desc{font-weight:400}
.opt select,.opt input{color:#fff}
.opt select option{background:var(--blue)}
.go{width:100%;font-size:1.1rem;letter-spacing:.2em;text-transform:uppercase}
.sumwin .sumlist{columns:2}
@media (max-width:720px){.main{grid-template-columns:1fr}.cmd{display:grid;grid-template-columns:1fr 1fr}.sumwin .sumlist{columns:1}}

:root{--font:"DWR Mockup","Courier New",monospace}
body{font-synthesis:none;-webkit-font-smoothing:none;font-smooth:never;letter-spacing:0;font-size:16px;line-height:1.5}
body *{font-size:16px!important;letter-spacing:0!important}
.title h1{font-size:32px!important}
.screen{max-width:1200px}
.idrow{display:flex;flex-wrap:wrap;gap:.8rem 1.6rem;align-items:start}
.idfields{flex:0 1 auto;min-width:0;max-width:100%}
.idpresets{flex:1 1 15rem;min-width:0;margin-top:.4rem}
.presetgrid{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.4rem}
.row input[type=text]{flex:0 1 auto;width:calc(40ch + 1.2rem);max-width:100%}
.screen{grid-template-columns:minmax(0,1fr)}
.screen>*{min-width:0}
.main{grid-template-columns:19rem minmax(0,1fr)}
.row input[type=text]{flex:1 1 auto;min-width:0;width:calc(40ch + 1.2rem)}
.idfields{flex:0 1 calc(40ch + 7rem)}
.idbtns{margin-left:calc(4.5rem + .6rem)}
.idpresets{flex:1 1 18rem;margin-top:0}
input[type=file]::file-selector-button{font:inherit}
.meter{height:1.1rem;border:2px solid #fff;background:#000;margin:.8rem 0 .3rem}
.meter i{display:block;height:100%;background-image:repeating-linear-gradient(90deg,var(--c) 0 14px,transparent 14px 16px)}
.meter i.gentle{--c:#4cdc48}.meter i.balanced{--c:#fcd800}.meter i.brutal{--c:#f83800}
.feel{margin:0}

.row label{min-width:5.5rem}
.idbtns{margin-left:calc(5.5rem + .6rem)}
@media (max-width:720px){.idbtns{margin-left:0}}
.leftcol{display:grid;gap:1.4rem;min-width:0}
.feelwin .meter{margin-top:.4rem}
.idfields{flex-basis:calc(40ch + 8rem)}
@media (max-width:720px){.idfields{flex-basis:100%}}
body *{font-size:12px!important}
.title h1{font-size:24px!important;margin:0}
.title p{display:none}
.backlink{padding:.1rem .5rem}
.win{padding:.7rem .7rem .5rem}
.row{margin:.25rem 0;gap:.4rem}
.row label{min-width:3.5rem}
.idbtns{margin-left:calc(3.5rem + .4rem)}
.idfields{flex-basis:calc(40ch + 5rem)}
.row input[type=text]{width:calc(40ch + 1.2rem)}
.idpresets{margin-top:0}
.cmd .tab{min-height:1.9rem;padding-top:.2rem;padding-bottom:.2rem}
.opt{padding:.3rem .5rem}
.opt .tog{min-height:2rem;min-width:2.6rem}
.main{grid-template-columns:15rem minmax(0,1fr) 20rem;gap:1rem}

.heropic{width:96px;height:96px;margin:.3rem auto .5rem;background:#000;border:2px solid #fff;display:grid;place-items:center;box-sizing:content-box}
.heropic img{width:96px;height:96px;image-rendering:pixelated;display:block}
.heropic img[hidden],.heroq[hidden]{display:none}
.heroq{font-size:32px!important}
.herosel{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:.3rem;align-items:stretch}
.herosel select{min-width:0;width:100%;background:var(--blue);color:#fff;border:2px solid #fff}
.herosel .mini{padding:.2rem .4rem;min-height:2rem}
.trackbox{display:grid;gap:.6rem}
.onlytag{display:flex;align-items:center;gap:.5rem;cursor:pointer}
.onlytag input{width:1.1rem;height:1.1rem;accent-color:#fff}
.trackcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,24rem),1fr));gap:.6rem 1.4rem;align-items:start}
.trackcol{display:grid;gap:.25rem;min-width:0}
.trackrow{display:grid;grid-template-columns:10rem minmax(0,1fr) 5.5rem;gap:.4rem;align-items:center}
.trackrow select{width:100%;min-width:0;min-height:1.7rem;background:var(--blue);color:#fff;border:2px solid #fff}
.trackrow select:disabled{opacity:.55}
.tagn{color:var(--muted);text-align:right}
.trackrow{grid-template-columns:9.5rem minmax(0,1fr) 2rem}
.trackcols{grid-template-columns:repeat(auto-fit,minmax(min(100%,22rem),1fr))}
.savedpreset{display:inline-flex;gap:2px}
.presetdel{padding-inline:.5rem}
.idpresets{display:flex;flex-direction:column;align-self:stretch}
.presetarea{flex:1;display:flex;flex-direction:column;gap:.4rem}
.presetgrid{align-content:flex-start}
.presetsave{display:flex;gap:.4rem;margin-top:auto;align-items:center}
.presetname{flex:0 1 calc(20ch + 1.4rem);width:calc(20ch + 1.4rem);min-width:0;box-sizing:border-box;background:var(--blue);color:#fff;border:2px solid #fff;font:inherit;padding:.2rem .4rem}
.presetmsg{min-width:0}
.tier{cursor:help}
#tiertip{position:fixed;z-index:50;max-width:16rem;padding:.4rem .6rem;background:var(--blue);color:#fff;border:2px solid #fff;pointer-events:none}
#tiertip[hidden]{display:none}
#tiertip ul{margin:.2rem 0 0;padding:0;list-style:none}
/* Seeds are 64 bits: 20 digits at most. */
.row input#seed{flex:0 1 auto;width:calc(20ch + 1.8rem)}
.romforget{min-height:0;padding:.05rem .5rem}
.romforget[hidden]{display:none}
.idfields .row label{min-width:5.5rem}
.row input#checksum{flex:0 1 auto;width:calc(20ch + 1.8rem)}
.btn[disabled]{opacity:.5;cursor:default}
/* Short categories keep their rows compact instead of stretching to fill the panel. */
.opts{align-content:start;grid-auto-rows:max-content}
.opt{grid-template-rows:auto auto}
.opt .tog{align-self:start}
/* Menu group heads, option sections, and a tighter fit on short screens. */
.menuhead{color:#9ad;padding:.25rem .3rem .05rem;border-bottom:1px dotted var(--line);margin-top:.15rem}
.optsec{margin:.55rem 0 .05rem;padding:0 .3rem;color:#ffd23f;border-bottom:2px solid var(--line);font-weight:700;text-transform:uppercase}
.optsec:first-child{margin-top:0}
.secnote{margin:.15rem .3rem .1rem;color:var(--muted);font-weight:400}
.panel .blurb{flex:none}
.cmd .tab .count{float:right}
.cmd .tab{flex:none;white-space:nowrap}
.menuhead{flex:none;white-space:nowrap}
.idfields .row label{min-width:6.2rem}
@media (min-width:1000px) and (min-height:500px){.main{grid-template-columns:15.5rem minmax(0,1fr) 17rem}}
@media (min-width:1000px) and (max-height:760px){
 .screen{gap:.65rem;padding-top:.35rem;padding-bottom:.4rem}
 .title{padding:.1rem}
 .row{margin:.15rem 0}
 .row input[type=text],.idfields .btn,.presetarea .mini,.presetname{min-height:1.75rem;padding-top:.1rem;padding-bottom:.1rem}
 .cmd .tab{min-height:1.45rem;padding-top:.05rem;padding-bottom:.05rem}
 .heropic,.heropic img{width:48px;height:48px}
 .heropic{margin:.1rem auto .25rem}
 .herosel .mini{min-height:1.6rem}
}
.title h1{white-space:nowrap;font-size:min(24px,calc((100vw - 4rem) / 53))!important}
.btn.go,.btn.go:hover{background:#fff!important;color:var(--blue)!important;border-color:#fff!important}
.opt[data-id=encounters]>.name::after,.opt[data-id=encounters]>label::after,.opt[data-id=quickspell]>.name::after,.opt[data-id=quickspell]>label::after,.opt[data-id=bank]>.name::after,.opt[data-id=bank]>label::after,.opt[data-id=keyherb]>.name::after,.opt[data-id=keyherb]>label::after,.opt[data-id=noshake]>.name::after,.opt[data-id=noshake]>label::after,.opt[data-id=pack]>.name::after,.opt[data-id=pack]>label::after{content:'REMIX';display:inline-block;margin-left:.6em;padding:0 .3em;background:none;border:2px solid #5fe08a;color:#5fe08a;font-size:1em;line-height:1.1;white-space:nowrap}
.colorrow{display:flex;gap:.3rem;align-items:center;margin-top:.3rem;flex:none}
.colorrow select{flex:1 1 0;min-width:0;background:var(--blue);color:#fff;border:2px solid #fff}
.colorpick{flex:none;width:2.2rem;height:1.6rem;padding:0;background:none;border:2px solid #fff;cursor:pointer}
.colorpick[hidden]{display:none}
/* The sprite box is square, sized to what the screen height leaves. */
.heropic,.heropic img{width:var(--hero);height:var(--hero);box-sizing:border-box}
.heropic{--hero:10rem;margin:.3rem auto .4rem}
.heropic img{object-fit:contain;--hero:100%}
.heroq{font-size:3rem}
.idfields .result{margin:.2rem 0 0}
.idfields .result:empty{display:none}
.btn.go{white-space:nowrap}
@media (min-width:1000px) and (min-height:500px){
 .leftcol{height:100%;min-height:0;grid-template-rows:minmax(0,1fr) auto auto!important;gap:.65rem}
 .leftcol>:first-child{min-height:0;overflow:hidden}
 .rightcol{height:100%;grid-template-rows:minmax(0,1fr)!important}
 .heropic{--hero:clamp(96px,calc(100vh - 760px),190px);margin:.2rem auto .3rem}
 .herowin{padding-top:.6rem;padding-bottom:.4rem}
 .idfields{flex-basis:calc(40ch + 16rem)!important}
}
.idfields .btn.go{flex:none;width:auto;min-height:0}
.row input#checksum{width:calc(16ch + 1.8rem)}
/* Flags, Seed and Checksum make one block with matching edges and heights. */
@media (min-width:721px){
 .idfields{flex:0 0 auto!important;width:calc(6.2rem + .6rem + 40ch + 1.2rem)}
 .idfields .row{flex-wrap:nowrap;align-items:stretch;gap:.6rem}
 .idfields .row label{flex:0 0 6.2rem;min-width:0;align-self:center}
 .idfields .row input#flags{flex:1 1 0;width:auto;min-width:0}
 .idfields .row input#seed,.idfields .row input#checksum{flex:0 0 calc(20ch + 1.8rem);width:auto;min-width:0}
 .idfields .row .btn{flex:1 1 0;min-width:0;min-height:0!important;margin:0;padding:.1rem .3rem;box-sizing:border-box;white-space:nowrap}
 .idfields .row .btn.go{flex:2 1 0}
}
.colorwin{padding-top:.6rem;padding-bottom:.4rem}
.colorwin .colorrow{margin-top:.1rem}
.herowalk{width:100%;height:100%;image-rendering:pixelated;display:block}
.herowalk[hidden]{display:none}
.animrow{display:flex;align-items:center;gap:.4rem;margin-top:.25rem;cursor:pointer}
.animnote{color:var(--muted);margin-left:auto}

/* One floating list, so the scrolling panels can't clip it. */
function tierTip(){
  let t=document.getElementById('tiertip');
  if(!t){ t=el('div',{id:'tiertip',role:'tooltip'}); t.hidden=true; document.body.append(t); }
  return t;
}
function showTier(chip,i){
  const t=tierTip(); t.replaceChildren(el('b',{text:'Tier '+(i+1)}),el('ul',null,TIER_MONSTERS[i].map(m=>el('li',{text:m}))));
  t.hidden=false;
  const r=chip.getBoundingClientRect(), w=t.offsetWidth, h=t.offsetHeight;
  t.style.left=Math.max(4,Math.min(r.left,innerWidth-w-4))+'px';
  t.style.top=(r.bottom+h+4<=innerHeight?r.bottom+4:Math.max(4,r.top-h-4))+'px';
}
function hideTier(){ tierTip().hidden=true; }
document.addEventListener('keydown',e=>{ if(e.key==='Escape') hideTier(); });

function makeTabs(list, panel, tabs, render, orient, label){

  if(orient==='v') list.setAttribute('aria-orientation','vertical');

  function select(id, focus){
    cur=id; tabs.forEach(t=>{ const b=btns[t.id]; const on=t.id===id; b.setAttribute('aria-selected',on); b.tabIndex=on?0:-1; b.classList.toggle('active',on); });
    panel.setAttribute('role','tabpanel'); panel.setAttribute('aria-labelledby','tab-'+id); panel.innerHTML='';

  }

    const b=el('button',{type:'button',class:'tab',role:'tab',id:'tab-'+t.id,'data-id':t.id});

const COLOR_KEY='dwrSiteColor';
function hexRgb(h){ return [1,3,5].map(i=>parseInt(h.substr(i,2),16)); }
function rgbHex(c){ return '#'+c.map(v=>Math.round(v).toString(16).padStart(2,'0')).join(''); }
function contrastWithWhite(c){ const l=c.map(v=>{ v/=255; return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4); });
  return 1.05/(.2126*l[0]+.7152*l[1]+.0722*l[2]+.05); }

function readable(h){ let c=hexRgb(h); while(contrastWithWhite(c)<7) c=c.map(v=>v*.95); return rgbHex(c); }

/* Walking frames come from a ROM built with that sprite, so they're exactly what the game shows. */
const NES_COLORS='7C7C7C0000FC0000BC4428BC940084A80020A81000881400503000007800006800005800004058000000000000000000BCBCBC0078F80058F86844FCD800CCE40058F83800E45C10AC7C0000B80000A80000A844008888000000000000000000F8F8F83CBCFC6888FC9878F8F878F8F85898F87858FCA044F8B800B8F81858D85458F89800E8D8787878000000000000FCFCFCA4E4FCB8B8F8D8B8F8F8B8F8F8A4C0F0D0B0FCE0A8F8D878D8F878B8F8B8B8F8D800FCFCF8D8F8000000000000';
const nesColor=i=>'#'+NES_COLORS.substr((i&63)*6,6);
const HERO_FRAMES={};
function buildHeroFrames(name){
  if(HERO_FRAMES[name]) return HERO_FRAMES[name];
  const flags='IVIAAVCEKACAAAAAAAAAAEAUAAQBAAAAABYCAAAA', file='/DWRando.1.'+flags+'.nes';
  FS.writeFile('/input.nes',State.rom.bytes);
  Module.ccall('custom_music_clear',null,[],[]);
  const sum=Module.ccall('dwr_randomize','bigint',['string','bigint','string','string','string'],['/input.nes',1n,flags,name,'/']);
  if(sum===0n) return null;
  const rom=FS.readFile(file); FS.unlink(file);
  const content=16, chr=16+0xc000+0x10000+0x4000+0x2000;
  /* The hero's front-facing row: two frames of four (tile, attribute) pairs. */
  const row=content+0x15b4, frames=[0,1].map(f=>{ const cv=document.createElement('canvas'); cv.width=cv.height=16; const g=cv.getContext('2d');
    for(let q=0;q<4;q++){ const t=rom[row+f*8+q*2], at=rom[row+f*8+q*2+1], pal=content+0x1a8b+(at&3)*3, d=chr+t*16;
      for(let y=0;y<8;y++){ const yy=at&0x80?7-y:y;
        for(let x=0;x<8;x++){ const b=at&0x40?x:7-x, c=((rom[d+yy]>>b)&1)|(((rom[d+yy+8]>>b)&1)<<1);
          if(c){ g.fillStyle=nesColor(rom[pal+c-1]); g.fillRect((q%2)*8+x,(q>>1)*8+y,1,1); } } } }
    return cv; });
  return HERO_FRAMES[name]=frames;
}
function heroWin(){
