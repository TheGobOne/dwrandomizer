<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dragon Warrior Randomizer - TheGobOne Remix</title>
<style>
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 var(--font,system-ui,sans-serif)}
button,input,select{font:inherit;color:inherit}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--focus,#ffd23f);outline-offset:2px}
.backlink{display:inline-block;padding:.5rem .75rem;color:var(--link,var(--fg));font-size:.85rem;text-decoration:underline}
a{color:var(--link,inherit)}
/* shared control skeleton, themed per page through variables */
.opt{position:relative;padding:.55rem .6rem;display:grid;grid-template-columns:auto 1fr;column-gap:.7rem;row-gap:.1rem;align-items:start}
.opt .tog{grid-row:1/3;min-width:3.1rem;min-height:2.75rem;cursor:pointer;background:var(--tog-bg,transparent);border:var(--tog-bd,2px solid currentColor);border-radius:var(--tog-r,0);padding:0 .35rem;display:inline-flex;align-items:center;justify-content:center;font-weight:700}
.opt .tog[data-state="1"]{background:var(--tog-on,var(--accent));color:var(--tog-on-fg,var(--bg))}
.opt .tog[data-state="2"]{background:var(--tog-rnd,var(--accent2,var(--accent)));color:var(--tog-on-fg,var(--bg));border-style:dashed}
.opt .name{font-weight:700;align-self:center;cursor:pointer}
.opt .desc{grid-column:2;margin:0;font-size:.85rem;color:var(--muted)}
.opt[data-id=build] .desc{white-space:pre-line}
.opt.k-select,.opt.k-pack{grid-template-columns:1fr}
.opt .hint{color:#ffd23f}
.opt.k-select .desc,.opt.k-pack .desc{grid-column:1}
.opt select,.opt input[type=number],.opt input[type=file]{max-width:100%;background:var(--field,transparent);border:var(--field-bd,2px solid currentColor);border-radius:var(--tog-r,0);padding:.45rem .5rem;min-height:2.6rem}
.opt.k-toggle>.bankbox,.opt.k-toggle>.packbox{grid-column:1/-1}
.bankbox,.packbox{margin:.5rem 0 .2rem;padding:.7rem;border:var(--sub-bd,2px dashed currentColor);display:grid;gap:.4rem}
.sublab{font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.caprow{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.caprow input[type=range]{flex:1 1 8rem;min-height:2.5rem;accent-color:var(--accent)}
.caprow input[type=number]{width:5rem}
.banknote,.packstat{margin:0;font-size:.85rem}
.tiers,.scenes{display:flex;flex-wrap:wrap;gap:.3rem}
.tier,.scene{border:1px solid currentColor;padding:.1rem .4rem;font-size:.78rem}
.scene.used{background:var(--accent);color:var(--bg)}
.songs{margin:0;padding-left:1.1rem;font-size:.85rem}
.mini,.btn{cursor:pointer;min-height:2.75rem;padding:.4rem .9rem;background:var(--btn-bg,var(--accent));color:var(--btn-fg,var(--bg));border:var(--btn-bd,2px solid currentColor);border-radius:var(--tog-r,0);font-weight:700}
.mini{min-height:2.4rem;padding:.2rem .7rem;font-size:.85rem;--btn-bg:transparent;--btn-fg:currentColor}
input[type=text]{background:var(--field,transparent);border:var(--field-bd,2px solid currentColor);border-radius:var(--tog-r,0);padding:.5rem;min-height:2.75rem;max-width:100%}
.result{margin:.5rem 0;word-break:break-all}
.sumlist{margin:0;padding-left:1.1rem;font-size:.9rem}
.romfile{max-width:100%}
.tab{cursor:pointer}
.count{display:inline-block;min-width:1.4em;text-align:center;font-size:.75em;padding:0 .3em;margin-left:.35em;border:1px solid currentColor}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

:root{--blue:#00008a;--line:#5a6bd0;--soft:#b9c4ff;--bg:#000;--fg:#fff;--accent:#fff;--muted:var(--soft);--font:"Courier New",ui-monospace,monospace;--tog-bd:1px solid var(--soft);--tog-on:#fff;--tog-on-fg:var(--blue);--tog-rnd:var(--soft);--field:var(--blue);--field-bd:2px solid #fff;--btn-bg:var(--blue);--btn-fg:#fff;--btn-bd:3px double #fff;--sub-bd:2px solid var(--soft);--focus:#ffff55}
body{font-weight:700;letter-spacing:.02em}
.screen{max-width:1000px;margin:0 auto;padding:.5rem 1rem 2rem;display:grid;gap:1.4rem}
.win{background:var(--blue);border:4px double #fff;border-radius:6px;padding:1rem 1rem .8rem;box-shadow:0 0 0 3px #000,0 0 0 5px #fff4;position:relative}
.win h2{margin:0;font-size:1rem;text-transform:uppercase;letter-spacing:.12em;background:#000;padding:0 .5rem;position:absolute;top:-.8rem;left:1rem}
.title{text-align:center}
.title h1{font-size:clamp(1.2rem,5vw,2.2rem);letter-spacing:.2em;margin:.2rem 0}
.title p{margin:.2rem 0;color:var(--muted);font-weight:400}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin:.4rem 0}
.row label{min-width:4.5rem}
.row input[type=text]{flex:1 1 14rem;color:#fff;font-size:.85rem}
.main{display:grid;grid-template-columns:15rem 1fr;gap:1.4rem;align-items:start}
.cmd{display:flex;flex-direction:column;gap:.1rem}
.cmd .tab{background:none;border:0;color:#fff;text-align:left;padding:.45rem .5rem .45rem 1.6rem;min-height:2.75rem;position:relative;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.cmd .tab::before{content:"";position:absolute;left:.4rem;top:50%;margin-top:-.4rem;border-left:.7rem solid transparent;border-top:.4rem solid transparent;border-bottom:.4rem solid transparent}
.cmd .tab.active::before{border-left-color:#fff}
.cmd .tab:hover::before{border-left-color:var(--soft)}
.cmd .tab.active{background:#000}
.cmd .count{float:right;border:0;color:var(--soft)}
.panel .blurb{margin:0 0 .6rem;color:var(--muted);font-weight:400}
.opts{display:grid;gap:.1rem}
.opt{border-bottom:1px dotted var(--line)}
.opt .tog{font-family:inherit}
.opt .desc{font-weight:400}
.opt select,.opt input{color:#fff}
.opt select option{background:var(--blue)}
.go{width:100%;font-size:1.1rem;letter-spacing:.2em;text-transform:uppercase}
.sumwin .sumlist{columns:2}
.flagsizes{margin:.3rem 0 .6rem}
.fsh{color:var(--muted);margin:.3rem 0 .1rem}
.fsrow{display:flex;justify-content:space-between;gap:.6rem}
@media (max-width:720px){.main{grid-template-columns:1fr}.cmd{display:grid;grid-template-columns:1fr 1fr}.sumwin .sumlist{columns:1}}

const State = {
  v:{}, bankLevel:0, bankCap:9, pack:null, rom:null, seed:'', listeners:[],
  init(){ TABS.forEach(t=>t.items.forEach(it=>{ this.v[it[0]] = 0; }));
    ['wrap','speed'].forEach(()=>{}); this.applyPreset(PRESETS[0], true); this.newSeed(); },
  all(){ return TABS.flatMap(t=>t.items); },
  find(id){ return this.all().find(i=>i[0]===id); },
  set(id,val){ this.v[id]=val; this.emit(id); },
  /* Personal settings stay on through presets, as in the old web UI. They don't change the checksum. */
  keepPersonal(fn){
    const on=PERSONAL.filter(id=>this.v[id]), sprite=this.v.sprite;
    fn(); on.forEach(id=>{ this.v[id]=1; }); this.v.sprite=sprite; this.emit('*');
  },
  applyPreset(p, quiet){
    this.all().forEach(it=>{ this.v[it[0]]=0; });
    this.bankLevel=0; this.bankCap=9;
    if(p.flags){ this.setFlags(p.flags); return; }
    (p.on||[]).forEach(i=>this.v[i]=1); (p.rnd||[]).forEach(i=>this.v[i]=2);
    Object.entries(p.sel||{}).forEach(([k,v])=>{ if(k==='bankLevel') this.bankLevel=v; else this.v[k]=v; });
    Object.entries(p.num||{}).forEach(([k,v])=>{ this[k]=v; });
    if(!quiet) this.emit('*');
  },
  newSeed(){ this.seed = String(Math.floor(Math.random()*9e12)+1e12); this.emit('seed'); },
  /* The real flag string: same bytes as the randomizer reads. */
  flags(){
    const bytes=new Uint8Array(26);
    this.all().forEach(it=>{ const m=FLAG_MAP[it[1]]; if(!m) return;
      const x=this.v[it[0]]|0;
      const val=m.values ? (m.values[it[4][x]]||0) : m.invert ? 1-x : x;
      bytes[m.byte]|=val<<m.shift; });
    const rate=this.v.encounters|0;
    bytes[3]|=(rate>>1)&1; bytes[6]|=rate&1;
    bytes[12]=(this.bankCap===9?0:this.bankCap&0x7f)|((this.bankLevel&2)<<6);
    bytes[14]|=this.bankLevel&1;
    /* Biome numbers past Riverlands go in byte 25, which only joins the code when set, so old codes stay 40 letters. */
    const biome=this.v.biome|0, BIOMES=this.find('biome')[4];
    /* Biome only means something with Random Map on (or maybe), so with it off the code stays 40 letters. */
    if(biome>=4&&(this.v.map|0)){ bytes[2]&=~0x33; bytes[25]=BIOMES[biome]==='Random'?0xff:biome; }
    let out='',bits=0,n=0;
    (bytes[25]?bytes:bytes.subarray(0,25)).forEach(b=>{ bits=(bits<<8)|b; n+=8; while(n>=5){ out+=FLAG_CHARS[(bits>>(n-5))&31]; n-=5; } bits&=(1<<n)-1; });
    if(n) out+=FLAG_CHARS[(bits<<(5-n))&31];
    return out;
  },
  setFlags(text){
    let bits=0,n=0; const bytes=[];
    for(const c of text.toUpperCase()){ const i=FLAG_CHARS.indexOf(c); if(i<0) return false;
      bits=(bits<<5)|i; n+=5; if(n>=8){ bytes.push((bits>>(n-8))&255); n-=8; bits&=(1<<n)-1; } }
    /* 40 letters are 25 bytes, 42 are 26. 41 or 43 would also round down to those, so check the length itself. */
    if(text.length!==40&&text.length!==42) return false;
    this.all().forEach(it=>{ const m=FLAG_MAP[it[1]]; if(!m) return;
      if(m.values){ const raw=(bytes[m.byte]>>m.shift)&m.mask, name=Object.keys(m.values).find(k=>m.values[k]===raw);
        const i=it[4].indexOf(name); if(i<0) this.oddFlags=true; this.v[it[0]]=i<0?0:i; }
      else { const raw=(bytes[m.byte]>>m.shift)&m.mask; this.v[it[0]]=m.invert?1-raw:raw; } });
    if(bytes[25]){ const list=this.find('biome')[4], i=bytes[25]===0xff?list.indexOf('Random'):bytes[25];
      if(i>0&&i<list.length) this.v.biome=i; else this.oddFlags=true; }
    this.v.encounters=((bytes[3]&1)<<1)|(bytes[6]&1);
    this.bankCap=(bytes[12]&0x7f)||9;
    this.bankLevel=((bytes[12]&0x80)>>6)|(bytes[14]&1);
    this.emit('*'); return true;
  },
  activeCount(){ return this.all().filter(isChanged).length; },
  on(fn){ this.listeners.push(fn); },
  emit(id){ this.listeners.forEach(f=>f(id)); }
};

/* ---------- helpers ---------- */
function el(tag, attrs, ...kids){
  const e=document.createElement(tag);
  for(const k in (attrs||{})){ const v=attrs[k]; if(v==null||v===false) continue;
    if(k==='class') e.className=v; else if(k==='text') e.textContent=v; else if(k.startsWith('on')) e.addEventListener(k.slice(2),v); else e.setAttribute(k,v===true?'':v); }
  kids.flat().forEach(k=>{ if(k==null) return; e.append(k.nodeType?k:document.createTextNode(k)); });
  return e;
}

    part('Off: bytes each would take',rows.filter(r=>!r.on&&(r.bytes===null||r.bytes>0)));
    const zero=rows.filter(r=>r.bytes!==null&&r.bytes<=0).length; if(zero) sizeOut.append(el('div',{class:'fsh',text:zero+' flags take no ROM space.'}));
  }catch(e){ sizeOut.textContent='Could not measure: '+(e&&e.message||e); }
  finally{ sizing=false; sizeBtn.disabled=false; }
});
const sum=el('section',{class:'win sumwin'},el('h2',{text:'Status'}),el('label',{class:'onlytag sumcompact',for:'statuscompact'},compactCb,' Compact'),spaceLine,sumUl,sizeBtn);
main.append(el('div',{class:'leftcol'},cmd,searchWin(),el('div',{class:'herostack'},heroWin(),colorRow())),panel,el('div',{class:'rightcol'},sum));
scr.append(main);
app.append(scr);

</script>
